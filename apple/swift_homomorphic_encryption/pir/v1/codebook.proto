syntax = "proto3";
package apple.swift_homomorphic_encryption.pir.v1;

// In PIR lookup on embeddings, we divide the embeddings into clusters with a centroid.
// EmbeddingCodebook lists all the centroid embeddings.
// PIR Clients downloads the codebook, lookup the centroids that are closer to the query embedding and then perform
//   server PIR lookup on closest clusters.
message EmbeddingCodebook {
  // Dimension of each embedding vector.
  uint32 embedding_dimension = 1;

  // Concatenated centroid embeddings for all clusters stored as a single byte array.
  // Clusters are numbered starting from 0, and embeddings must be parsed using embedding_dimension.
  // Format: All centroid embeddings stored consecutively as:
  //   [centroid_0_embedding, centroid_1_embedding, centroid_2_embedding, ...]
  // Each centroid embedding is:
  //   IEEE 754 half-precision (16-bit) floating-point embeddings stored as flat byte sequences.
  //   Each embedding is serialized as a contiguous array of 2-byte big-endian encoded float16 values.
  //   Format: [float16_0_byte0, float16_0_byte1, float16_1_byte0, float16_1_byte1, ...]
  //   where each float16 value uses IEEE 754 binary16 format with big-endian byte ordering.
  // To parse: centroid_count = len(centroid_embedding_fp16) / (embedding_dimension * 2)
  bytes centroid_embedding_fp16 = 2;

  // Number of nearest clusters to probe when processing a query.
  // Higher values improve recall at the cost of more PIR lookups.
  // If unset, clients should probe 1 cluster.
  optional uint32 num_clusters_to_probe = 3;
}
